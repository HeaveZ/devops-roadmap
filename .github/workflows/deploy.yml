name: Build & Deploy

on:
  push:
    branches: [Taskly]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/heavez/devops-roadmap

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [task-manager, auth-server, email-sender, audit-logger, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/heavezz
            cat > .env << ENVEOF
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
            AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            AWS_BUCKET_NAME=${{ secrets.AWS_BUCKET_NAME }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASS=${{ secrets.SMTP_PASS }}
            IMAGE_TAG=${{ github.sha }}
            ENVEOF
            sed -i 's/^[[:space:]]*//' .env
            docker pull ${{ env.IMAGE_PREFIX }}/task-manager:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}/auth-server:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}/email-sender:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}/audit-logger:${{ github.sha }}
            docker pull ${{ env.IMAGE_PREFIX }}/frontend:${{ github.sha }}
            docker compose up -d --force-recreate
